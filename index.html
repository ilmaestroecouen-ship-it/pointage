<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Il Maestro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5EEE0">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" href="icone.png">
<title>Il Maestro — Pointage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --creme: #F5EEE0;
    --papier: #FFFBF3;
    --bordeaux: #7B1E2B;
    --bordeaux-f: #5C1520;
    --rose: #F6DEDC;
    --olive: #5B6838;
    --olive-f: #46512A;
    --olive-c: #E8EBD9;
    --or: #B08A4C;
    --or-c: #F2E7D2;
    --encre: #2B221D;
    --doux: #7A6E63;
    --ligne: #E3D7C2;
    --ombre: 0 14px 34px rgba(70, 40, 20, .10), 0 2px 6px rgba(70, 40, 20, .06);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background-color: var(--creme);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255, 255, 255, .75), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(176, 138, 76, .12), transparent 40%);
    background-attachment: fixed;
    color: var(--encre);
    font-family: var(--sans);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
  input, select, textarea { font: inherit; color: inherit; }
  .tricolore { height: 6px; background: linear-gradient(90deg, var(--olive) 0 33.33%, var(--papier) 33.33% 66.66%, var(--bordeaux) 66.66%); }
  .carte { background: var(--papier); border: 1px solid var(--ligne); border-radius: 28px; box-shadow: var(--ombre); }
  .lien { color: var(--bordeaux); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .muet { color: var(--doux); }

  /* ---------- Logo ---------- */
  .logo { display: inline-flex; flex-direction: column; align-items: center; }
  .logo .nom { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 76px; line-height: .95; color: var(--bordeaux); letter-spacing: -.01em; }
  .logo .orn { display: flex; align-items: center; gap: 12px; color: var(--or); margin-top: 10px; font-size: 12px; letter-spacing: .38em; text-transform: uppercase; }
  .logo .orn::before, .logo .orn::after { content: ''; width: 46px; height: 1px; background: var(--or); }

  /* ---------- Borne de pointage ---------- */
  .borne { min-height: calc(100vh - 6px - 60px); display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 56px; padding: 32px 56px; max-width: 1180px; margin: 0 auto; }
  .accueil { text-align: center; }
  .horloge { font-family: var(--serif); font-size: 128px; font-weight: 500; line-height: 1; margin-top: 34px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .date-jour { font-size: 22px; color: var(--doux); margin-top: 6px; }
  .date-jour::first-letter { text-transform: uppercase; }
  .salut { font-family: var(--serif); font-style: italic; font-size: 34px; color: var(--olive); margin: 28px 0 6px; }
  .aide { color: var(--doux); font-size: 18px; line-height: 1.5; margin: 0; }
  .clavier-carte { padding: 30px 34px 34px; width: 100%; max-width: 430px; justify-self: center; text-align: center; }
  .code-titre { font-family: var(--serif); font-size: 30px; font-weight: 600; }
  .points { display: flex; gap: 20px; justify-content: center; margin: 16px 0 4px; }
  .points span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--or); transition: background .15s, border-color .15s; }
  .points span.plein { background: var(--bordeaux); border-color: var(--bordeaux); }
  .points.secoue { animation: secoue .4s; }
  @keyframes secoue { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .msg-erreur { min-height: 24px; color: var(--bordeaux); font-weight: 500; font-size: 16px; }
  .clavier { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 12px; }
  .clavier button { height: 80px; border-radius: 22px; background: var(--creme); border: 1px solid var(--ligne); font-family: var(--serif); font-size: 40px; font-weight: 600; transition: transform .08s, background .15s; user-select: none; -webkit-user-select: none; }
  .clavier button:active { transform: scale(.94); background: var(--or-c); }
  .clavier .fn { font-family: var(--sans); font-size: 22px; font-weight: 500; color: var(--doux); }
  .clavier .ok { background: var(--bordeaux); border-color: var(--bordeaux); color: #fff; font-family: var(--sans); font-size: 22px; letter-spacing: .12em; }
  .clavier .ok:active { background: var(--bordeaux-f); }
  .pied { height: 60px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .pied .lien { color: var(--doux); font-size: 15px; }
  .demo-info { position: fixed; left: 16px; bottom: 14px; max-width: 300px; font-size: 13px; line-height: 1.5; background: var(--papier); border: 1px dashed var(--or); border-radius: 14px; padding: 10px 14px; color: var(--doux); }
  .demo-info b { color: var(--encre); }

  /* ---------- Écrans centrés (choix, confirmation, message) ---------- */
  .centre { min-height: calc(100vh - 6px); display: grid; place-items: center; padding: 28px; }
  .choix, .confirmation, .message, .connexion { width: 100%; max-width: 780px; padding: 44px 48px; text-align: center; }
  .bonjour { font-family: var(--serif); font-size: 58px; font-weight: 600; line-height: 1.05; }
  .bonjour em { color: var(--bordeaux); }
  .etat { font-size: 20px; color: var(--doux); margin: 12px 0 0; }
  .etat b { color: var(--olive-f); }
  .du-jour { margin-top: 10px; color: var(--doux); font-size: 16px; }
  .gros-boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 34px 0 26px; }
  .gros { border-radius: 26px; padding: 30px 18px 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 30px; font-weight: 600; color: #fff; box-shadow: 0 10px 24px rgba(60, 30, 20, .18); transition: transform .08s; }
  .gros:active { transform: scale(.97); }
  .gros svg { width: 50px; height: 50px; margin-bottom: 6px; }
  .gros small { font-size: 16px; font-weight: 400; opacity: .9; }
  .gros.arrivee { background: var(--olive); }
  .gros.depart { background: var(--bordeaux); }
  .gros.discret { background: var(--papier); box-shadow: none; border: 2px solid currentColor; }
  .gros.arrivee.discret { color: var(--olive); }
  .gros.depart.discret { color: var(--bordeaux); }
  .actions-bas { display: flex; justify-content: center; gap: 36px; font-size: 18px; }
  .actions-bas button { display: inline-flex; align-items: center; gap: 8px; }
  .alerte { background: var(--rose); color: var(--bordeaux-f); border-radius: 16px; padding: 14px 18px; font-weight: 500; margin-top: 22px; }
  .coche { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 22px; color: #fff; background: var(--olive); animation: pop .35s ease-out; }
  .coche.depart { background: var(--bordeaux); }
  .coche.msg { background: var(--or); }
  .coche svg { width: 56px; height: 56px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .confirmation h2 { font-family: var(--serif); font-size: 52px; font-weight: 600; margin: 0; }
  .confirmation p { font-size: 22px; color: var(--doux); margin: 12px 0 0; }
  .barre-temps { height: 4px; background: var(--ligne); border-radius: 4px; margin-top: 34px; overflow: hidden; }
  .barre-temps span { display: block; height: 100%; background: var(--or); animation: vide 5s linear forwards; }
  @keyframes vide { from { width: 100%; } to { width: 0; } }
  .message h2, .connexion h2 { font-family: var(--serif); font-size: 44px; font-weight: 600; margin: 0 0 8px; }
  .message p { color: var(--doux); font-size: 18px; margin: 0 0 20px; }
  .puces { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .puces button { padding: 10px 16px; border-radius: 999px; background: var(--or-c); color: #6d5122; font-size: 16px; }
  textarea { width: 100%; min-height: 130px; border-radius: 18px; border: 1px solid var(--ligne); background: #fff; padding: 16px 18px; font-size: 19px; resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--or); outline-offset: 1px; }
  .rangee-btn { display: flex; justify-content: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }

  /* ---------- Boutons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 14px; background: var(--bordeaux); color: #fff; font-weight: 500; white-space: nowrap; }
  .btn:active { transform: scale(.98); }
  .btn.grand { padding: 16px 34px; font-size: 19px; border-radius: 18px; }
  .btn.sec { background: transparent; border: 1px solid var(--ligne); color: var(--encre); }
  .btn.or { background: var(--or); }
  .btn.olive { background: var(--olive); }
  .btn.danger { background: transparent; color: var(--bordeaux); border: 1px solid var(--rose); }
  .btn svg { width: 18px; height: 18px; }

  /* ---------- Espace gérant ---------- */
  .barre { display: flex; align-items: center; gap: 22px; padding: 12px 28px; background: rgba(255, 251, 243, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--ligne); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .barre .logo-p { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 32px; color: var(--bordeaux); line-height: 1; }
  .barre .logo-p small { display: block; font-family: var(--sans); font-style: normal; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--or); margin-top: 3px; }
  .onglets { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .onglets button { padding: 10px 16px; border-radius: 999px; font-weight: 500; color: var(--doux); }
  .onglets button.actif { background: var(--bordeaux); color: #fff; }
  .pastille { display: inline-block; min-width: 20px; background: var(--or); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 7px; margin-left: 6px; text-align: center; }
  .barre .droite { display: flex; gap: 10px; }
  .contenu { padding: 30px 28px 60px; max-width: 1200px; margin: 0 auto; }
  .entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1.titre { font-family: var(--serif); font-weight: 600; font-size: 44px; margin: 0; line-height: 1.05; }
  h1.titre::first-letter { text-transform: uppercase; }
  .sous { color: var(--doux); margin: 6px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 26px; }
  .stat { padding: 18px 22px; border-radius: 22px; }
  .stat .v { font-family: var(--serif); font-size: 44px; font-weight: 600; color: var(--bordeaux); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--doux); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .grille-sal { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .carte-sal { padding: 20px 22px; border-radius: 22px; text-align: left; display: flex; flex-direction: column; gap: 10px; border-left: 6px solid var(--ligne); }
  .carte-sal .nom { font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1; }
  .carte-sal .det { color: var(--doux); font-size: 15px; font-variant-numeric: tabular-nums; }
  .carte-sal.encours { border-left-color: var(--olive); }
  .carte-sal.travail { border-left-color: var(--or); }
  .carte-sal.absent { border-left-color: var(--bordeaux); }
  .pill { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .02em; background: var(--creme); color: var(--doux); }
  .pill.encours { background: var(--olive-c); color: var(--olive-f); }
  .pill.encours::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--olive); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .pill.travail { background: var(--or-c); color: #6d5122; }
  .pill.absent { background: var(--rose); color: var(--bordeaux); }
  .pill.conge, .pill.repos, .pill.maladie, .pill.justifie { background: #E9E4F0; color: #4F4565; }

  .outils { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .segment { display: inline-flex; background: var(--papier); border: 1px solid var(--ligne); border-radius: 999px; padding: 4px; }
  .segment button { padding: 9px 20px; border-radius: 999px; font-weight: 500; color: var(--doux); }
  .segment button.actif { background: var(--encre); color: var(--papier); }
  .nav-periode { display: inline-flex; align-items: center; gap: 6px; }
  .rond { width: 42px; height: 42px; border-radius: 50%; background: var(--papier); border: 1px solid var(--ligne); display: inline-grid; place-items: center; font-size: 20px; }
  .titre-periode { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 0 10px; min-width: 0; }
  .titre-periode::first-letter { text-transform: uppercase; }
  .espace { flex: 1; }

  .tableau { padding: 6px 4px; border-radius: 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--doux); text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--ligne); font-weight: 500; white-space: nowrap; }
  td { padding: 14px 16px; border-bottom: 1px solid var(--ligne); vertical-align: middle; }
  tr:last-child > td { border-bottom: 0; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fort { font-weight: 600; }
  .nom-sal { font-family: var(--serif); font-size: 23px; font-weight: 600; white-space: nowrap; }
  tr.ligne-sal { cursor: pointer; }
  tr.ligne-sal:hover > td { background: rgba(255, 255, 255, .6); }
  tr.ligne-sal.ouvert > td { background: #fff; border-bottom-color: transparent; }
  .chevron { color: var(--doux); transition: transform .2s; display: inline-block; }
  tr.ouvert .chevron { transform: rotate(90deg); }
  tr.detail > td { background: #fff; padding: 0 16px 20px; }
  .jours { width: 100%; background: var(--creme); border-radius: 18px; overflow: hidden; }
  .jours td { padding: 9px 14px; border-bottom: 1px solid var(--ligne); font-size: 15px; }
  .jours tr.ferme td, .jours tr.avenir td { color: #ADA295; }
  .jours .jour { white-space: nowrap; width: 120px; }
  .semaines { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .sem { background: var(--creme); border-radius: 14px; padding: 10px 14px; font-size: 14px; color: var(--doux); }
  .sem b { color: var(--encre); font-variant-numeric: tabular-nums; }
  .sem .hs { color: var(--bordeaux); font-weight: 600; }

  .pt { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--papier); border: 1px solid var(--ligne); margin: 3px 6px 3px 0; font-variant-numeric: tabular-nums; font-size: 15px; }
  .pt i { font-style: normal; color: var(--doux); }
  .pt.ouvert { border-color: var(--olive); background: var(--olive-c); }
  .pt.auto, .pt.oubli { border-color: #E3B5B5; }
  .badge { white-space: nowrap; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
  .badge.auto, .badge.oubli { background: var(--rose); color: var(--bordeaux); }
  .badge.modifie, .badge.manuel { background: var(--or-c); color: #6d5122; }
  .plus { width: 32px; height: 32px; border-radius: 50%; border: 1px dashed var(--or); color: var(--or); font-size: 20px; line-height: 1; display: inline-grid; place-items: center; vertical-align: middle; }
  .sel-abs { border: 1px solid var(--ligne); border-radius: 10px; padding: 6px 10px; background: var(--papier); font-size: 14px; }
  .sel-abs.absent { color: var(--bordeaux); font-weight: 600; border-color: #E3B5B5; }
  .note-bas { color: var(--doux); font-size: 13.5px; line-height: 1.6; margin-top: 16px; }
  .vide { text-align: center; padding: 50px 20px; color: var(--doux); }
  .vide .serif { font-family: var(--serif); font-size: 30px; color: var(--encre); }

  .liste-msg { display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 20px 24px; border-radius: 22px; display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: start; border-left: 6px solid var(--or); }
  .msg.traite { opacity: .55; border-left-color: var(--ligne); box-shadow: none; }
  .msg .qui { font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .msg .quand { color: var(--doux); font-size: 14px; margin-left: 8px; font-family: var(--sans); font-weight: 400; }
  .msg .txt { grid-column: 1; font-size: 17px; line-height: 1.5; }
  .msg .act { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; gap: 8px; }

  .formulaire { padding: 28px 30px; border-radius: 24px; max-width: 640px; display: flex; flex-direction: column; gap: 18px; }
  .formulaire h3 { font-family: var(--serif); font-size: 28px; margin: 0; }
  label.champ { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--doux); font-weight: 500; }
  label.champ input, label.champ select { border: 1px solid var(--ligne); border-radius: 12px; padding: 12px 14px; background: #fff; font-size: 17px; color: var(--encre); width: 100%; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .jours-ferm { display: flex; flex-wrap: wrap; gap: 8px; }
  .jours-ferm label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ligne); background: #fff; color: var(--encre); font-size: 15px; }
  .jours-ferm input { accent-color: var(--bordeaux); width: 18px; height: 18px; }
  .case { display: inline-flex; align-items: center; gap: 10px; color: var(--encre); font-size: 16px; }
  .case input { width: 20px; height: 20px; accent-color: var(--bordeaux); }
  .code-sal { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: .12em; }
  .inactif td { opacity: .5; }

  .voile { position: fixed; inset: 0; background: rgba(43, 34, 29, .45); display: grid; place-items: center; padding: 20px; z-index: 20; animation: fondu .15s; }
  @keyframes fondu { from { opacity: 0; } }
  .modal { width: 100%; max-width: 520px; padding: 30px 32px; border-radius: 26px; display: flex; flex-direction: column; gap: 16px; max-height: 92vh; overflow: auto; }
  .modal h3 { font-family: var(--serif); font-size: 32px; font-weight: 600; margin: 0; }
  .modal .actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal .err { color: var(--bordeaux); font-weight: 500; margin: 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--encre); color: var(--papier); padding: 13px 24px; border-radius: 999px; z-index: 30; box-shadow: var(--ombre); animation: monte .25s; max-width: calc(100% - 32px); text-align: center; }
  .toast.err { background: var(--bordeaux); }
  @keyframes monte { from { transform: translate(-50%, 20px); opacity: 0; } }
  .chargement { position: fixed; inset: 0; display: grid; place-items: center; z-index: 25; background: rgba(245, 238, 224, .35); }
  .chargement span { width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--or-c); border-top-color: var(--bordeaux); animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .connexion { max-width: 460px; }
  .connexion input { width: 100%; border: 1px solid var(--ligne); border-radius: 16px; padding: 16px 18px; font-size: 20px; background: #fff; text-align: center; margin: 18px 0 4px; }

  /* ---------- Portrait / petits écrans ---------- */
  @media (orientation: portrait), (max-width: 900px) {
    .borne { grid-template-columns: 1fr; gap: 30px; padding: 30px 24px; justify-items: center; }
    .horloge { font-size: 104px; margin-top: 22px; }
    .salut { margin-top: 16px; }
    .demo-info { position: static; margin: 0 auto 24px; max-width: 430px; }
  }
  @media (max-width: 820px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .contenu { padding: 22px 16px 50px; }
    .barre { padding: 10px 16px; gap: 12px; }
    .msg { grid-template-columns: 1fr; }
    .msg .act { grid-row: auto; grid-column: 1; flex-direction: row; }
    .onglets button { padding: 8px 12px; }

<body>
<div class="tricolore"></div>
<div id="app"></div>
<!-- Adresse du serveur Google (à renseigner dans config.js) -->
<script src="config.js"></script>
<!-- Mode démo : utilisé tant que config.js est vide, ou avec ?demo dans l'adresse -->
<script src="demo/core.js"></script>
<script src="demo/demo.js"></script>
<script>
'use strict';

/* =========================================================
   Outils
   ========================================================= */
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const ABSENCES = { absent: 'Absent', repos: 'Repos', conge: 'Congé payé', maladie: 'Maladie', justifie: 'Absence justifiée' };
const STATUTS = { auto: 'Sortie auto 14h', oubli: 'Oubli de sortie', modifie: 'Corrigé', manuel: 'Ajouté' };
const HEURES_LEGALES = 35 * 60;

const pad = n => (n < 10 ? '0' : '') + n;
/** « CATAREU Veronica » → « Veronica » (le nom de famille est écrit en majuscules). */
const prenom = nom => {
  const mots = String(nom || '').trim().split(/\s+/);
  const p = mots.filter(m => m.length < 2 || m !== m.toUpperCase());
  return (p.length ? p : mots).join(' ');
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const versDate = d => { const p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); };
const deDate = t => t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
const ajouterJours = (d, n) => { const t = versDate(d); t.setUTCDate(t.getUTCDate() + n); return deDate(t); };
const jourSemaine = d => versDate(d).getUTCDay();
const lundi = d => { const w = jourSemaine(d); return ajouterJours(d, w === 0 ? -6 : 1 - w); };
const enMin = h => { const p = String(h).split(':'); return (+p[0]) * 60 + (+p[1]); };
const duree = (a, b) => { if (!a || !b) return 0; let m = enMin(b) - enMin(a); if (m < 0) m += 1440; return m; };
const fmtH = m => { m = Math.round(m || 0); return Math.floor(m / 60) + 'h' + pad(m % 60); };
const dec = m => Math.round((m || 0) / 60 * 100) / 100;
const dateLongue = d => { const t = versDate(d); return JOURS[t.getUTCDay()] + ' ' + t.getUTCDate() + ' ' + MOIS[t.getUTCMonth()] + ' ' + t.getUTCFullYear(); };
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dateCourte = d => { const t = versDate(d); return JOURS[t.getUTCDay()].slice(0, 3) + '. ' + t.getUTCDate() + ' ' + MOIS_COURTS[t.getUTCMonth()]; };
const jourMois = d => { const t = versDate(d); return t.getUTCDate() + ' ' + MOIS[t.getUTCMonth()]; };
function numeroSemaine(d) {
  const t = versDate(d); const j = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - j + 3);
  const premier = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - premier) / 864e5 - 3 + ((premier.getUTCDay() + 6) % 7)) / 7);
}
function maintenant() {
  const d = new Date();
  return { date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), time: pad(d.getHours()) + ':' + pad(d.getMinutes()), h: d.getHours() };
}
const stock = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { } }
};

const ICONES = {
  soleil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  lune: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>',
  coche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  lettre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>',
  telecharger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>'
};

/* =========================================================
   Serveur (Google Apps Script) ou démo locale
   ========================================================= */
const SERVEUR = String(window.POINTAGE_SERVEUR || '').trim();
const enLigne = !!SERVEUR && !new URLSearchParams(location.search).has('demo');

async function appelServeur(fonction, ...args) {
  if (!enLigne) {
    if (!window.DEMO) throw new Error('Démo indisponible.');
    await new Promise(r => setTimeout(r, 120));
    return window.DEMO[fonction](...args);
  }
  let reponse;
  try {
    // text/plain : évite la vérification CORS préalable, que Google Apps Script ne gère pas
    const r = await fetch(SERVEUR, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fonction, args })
    });
    reponse = await r.json();
  } catch (e) {
    throw new Error('Pas de connexion au serveur. Vérifie le wifi et réessaie.');
  }
  if (!reponse.ok) throw new Error(String(reponse.erreur || 'Erreur du serveur.').replace(/^(Exception|Error):\s*/i, ''));
  return reponse.resultat;
}
const api = (nom, args) => appelServeur('api', nom, args);

/* =========================================================
   État
   ========================================================= */
const S = {
  ecran: 'pointage',  // pointage | choix | confirmation | message | connexion | admin
  code: '', erreur: '', secoue: false, occupe: false,
  personne: null, confirmation: null,
  mdp: null, data: null,
  onglet: 'aujourdhui', vue: 'semaine', ref: null, deplie: {},
  modal: null, toast: null
};
const app = document.getElementById('app');
let minuterie = null, minuterieToast = null;

function render() {
  const vues = { pointage: vuePointage, choix: vueChoix, confirmation: vueConfirmation, message: vueMessage, connexion: vueConnexion, admin: vueAdmin };
  app.innerHTML = vues[S.ecran]()
    + (S.modal ? vueModal() : '')
    + (S.toast ? `<div class="toast ${S.toast.err ? 'err' : ''}">${esc(S.toast.texte)}</div>` : '')
    + (S.occupe ? '<div class="chargement"><span></span></div>' : '');
  S.secoue = false;
}

function toast(texte, err) {
  S.toast = { texte, err };
  render();
  clearTimeout(minuterieToast);
  minuterieToast = setTimeout(() => { S.toast = null; render(); }, err ? 4500 : 2500);
}

/** Retour automatique à l'écran de pointage après un temps d'inactivité. */
function armerRetour(ms) {
  clearTimeout(minuterie);
  if (ms) minuterie = setTimeout(retourAccueil, ms);
}
function retourAccueil() {
  clearTimeout(minuterie);
  // On ressort toujours de l'espace gérant déconnecté (tablette partagée)
  Object.assign(S, { ecran: 'pointage', code: '', erreur: '', personne: null, confirmation: null, modal: null, occupe: false, mdp: null, data: null });
  stock.set('im-mdp', null);
  render();
}

/* =========================================================
   Écran 1 : pointage (tablette)
   ========================================================= */
function logo() {
  return `<div class="logo"><div class="nom">Il Maestro</div><div class="orn">Pointage</div></div>`;
}
function vuePointage() {
  const n = maintenant();
  const demo = !enLigne && window.DEMO
    ? `<div class="demo-info"><b>Démo</b> — codes : ${window.DEMO.codes.map(c => `${esc(prenom(c[0]))} <b>${c[1]}</b>`).join(', ')}.<br>Espace gérant : <b>maestro</b></div>` : '';

      ${logo()}
      <div class="horloge" id="horloge">${n.time}</div>
      <div class="date-jour" id="date-jour">${dateLongue(n.date)}</div>
      <p class="salut">${n.h < 17 ? 'Buongiorno !' : 'Buonasera !'}</p>

    </section>
    <section class="carte clavier-carte">
      <div class="code-titre">Ton code</div>
      <div class="points ${S.secoue ? 'secoue' : ''}">${[0, 1, 2, 3].map(i => `<span class="${i < S.code.length ? 'plein' : ''}"></span>`).join('')}</div>
      <div class="msg-erreur">${esc(S.erreur)}</div>
      <div class="clavier">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(c => `<button data-a="chiffre" data-v="${c}">${c}</button>`).join('')}
        <button class="fn" data-a="effacer" aria-label="Effacer">⌫</button>
        <button data-a="chiffre" data-v="0">0</button>
        <button class="ok" data-a="valider">OK</button>

  </main>
  <footer class="pied"><button class="lien" data-a="versGerant">Espace gérant</button></footer>
  ${demo}`;

/* =========================================================
   Écran 2 : choix Arrivée / Fin de service
   ========================================================= */
function vueChoix() {
  const p = S.personne;
  const termines = p.duJour.filter(x => x.depart);
  const resume = termines.length
    ? `<div class="du-jour">Aujourd'hui : ${termines.map(x => `${x.arrivee} → ${x.depart}`).join(' · ')}</div>` : '';
  return `

      <p class="etat">${p.present ? `Tu es en service depuis <b>${p.depuis}</b>.` : "Tu n'es pas encore pointé."}</p>
      ${resume}
      ${S.erreur ? `<div class="alerte">${esc(S.erreur)}</div>` : ''}
      <div class="gros-boutons">
        <button class="gros arrivee ${p.present ? 'discret' : ''}" data-a="pointer" data-v="arrivee">${ICONES.soleil}Arrivée<small>Je commence mon service</small></button>
        <button class="gros depart ${p.present ? '' : 'discret'}" data-a="pointer" data-v="depart">${ICONES.lune}Fin de service<small>Je termine et je m'en vais</small></button>
      </div>
      <div class="actions-bas">
        <button class="lien" data-a="versMessage">${ICONES.lettre} Signaler une erreur</button>
        <button class="lien muet" data-a="accueil">Annuler</button>

}

/* =========================================================

function vueConfirmation() {

  return `
  <main class="centre" data-a="accueil">
    <div class="carte confirmation">

/* =========================================================
   Écran 4 : signaler une erreur
   ========================================================= */
const PHRASES = [
  ['Oubli de fin de service', "J'ai oublié de pointer ma fin de service. Je suis parti(e) à "],
  ["Oubli d'arrivée", "J'ai oublié de pointer mon arrivée. Je suis arrivé(e) à "],

];

      <div class="rangee-btn">

function vueConnexion() {

      <h2 style="margin-top:26px">Espace gérant</h2>

/* =========================================================
   Espace gérant : calculs
   ========================================================= */
function periode() {
  const ref = S.ref || S.data.now.journee;
  if (S.vue === 'jour') return { debut: ref, fin: ref, titre: dateLongue(ref), court: ref };
  if (S.vue === 'semaine') {
    const d = lundi(ref), f = ajouterJours(d, 6);
    return { debut: d, fin: f, titre: `Semaine ${numeroSemaine(d)} · du ${jourMois(d)} au ${jourMois(f)}`, court: `semaine-${numeroSemaine(d)}-${d.slice(0, 4)}` };
  }
  const d = ref.slice(0, 8) + '01';
  const t = versDate(d); t.setUTCMonth(t.getUTCMonth() + 1); t.setUTCDate(0);
  const mois = MOIS[+ref.slice(5, 7) - 1];
  return { debut: d, fin: deDate(t), titre: mois.charAt(0).toUpperCase() + mois.slice(1) + ' ' + ref.slice(0, 4), court: ref.slice(0, 7) };
}
function decaler(sens) {
  const ref = S.ref || S.data.now.journee;
  if (S.vue === 'jour') S.ref = ajouterJours(ref, sens);
  else if (S.vue === 'semaine') S.ref = ajouterJours(ref, 7 * sens);
  else { const t = versDate(ref.slice(0, 8) + '01'); t.setUTCMonth(t.getUTCMonth() + sens); S.ref = deDate(t); }
}

/** Heures sup. par semaine (lundi → dimanche), barème HCR : +10 % 36e-39e h, +20 % 40e-43e h, +50 % au-delà. */
function heuresSup(minutes) {
  const h10 = Math.min(Math.max(minutes - HEURES_LEGALES, 0), 240);
  const h20 = Math.min(Math.max(minutes - HEURES_LEGALES - 240, 0), 240);
  const h50 = Math.max(minutes - HEURES_LEGALES - 480, 0);
  return { h10, h20, h50, total: h10 + h20 + h50 };
}

function analyser(debut, fin, vue) {
  const D = S.data;
  const auj = D.now.journee;
  const journeeFinie = D.now.time >= D.reglages.heureAuto || D.now.journee < D.now.date;
  const fermes = (D.reglages.joursFermes || []).map(Number);
  const parJour = {}, abs = {};
  D.pointages.forEach(p => { (parJour[p.sid + '|' + p.date] = parJour[p.sid + '|' + p.date] || []).push(p); });
  D.absences.forEach(a => { abs[a.sid + '|' + a.date] = a; });
  const jours = [];
  for (let d = debut; d <= fin; d = ajouterJours(d, 1)) jours.push(d);

  const salaries = D.salaries.filter(s => s.actif || D.pointages.some(p => p.sid === s.id && p.date >= debut && p.date <= fin));
  return salaries.map(s => {
    const r = { s, minutes: 0, jours: 0, aVerifier: 0, absences: { absent: 0, repos: 0, conge: 0, maladie: 0, justifie: 0 }, lignes: [], semaines: [] };
    jours.forEach(date => {
      const pts = (parJour[s.id + '|' + date] || []).slice().sort((a, b) => a.arrivee < b.arrivee ? -1 : 1);
      const a = abs[s.id + '|' + date];
      let etat;
      if (pts.length) etat = 'travail';
      else if (a) etat = a.type;
      else if (date > auj || (date === auj && !journeeFinie) || (s.entree && date < s.entree)) etat = 'avenir';
      else if (fermes.includes(jourSemaine(date))) etat = 'ferme';
      else etat = 'absent';
      const minutes = pts.reduce((t, p) => t + duree(p.arrivee, p.depart), 0);
      const aVerifier = pts.filter(p => p.statut === 'auto' || p.statut === 'oubli').length;
      const enCours = pts.some(p => !p.depart);
      r.minutes += minutes; r.aVerifier += aVerifier;
      if (pts.length) r.jours++;
      if (r.absences[etat] !== undefined) r.absences[etat]++;
      r.lignes.push({ date, pts, etat, minutes, enCours, typeAbs: a ? a.type : '' });
    });
    // Semaines pour les heures sup. (en vue mois : semaines qui se terminent dans le mois)
    if (vue !== 'jour') {
      for (let l = lundi(debut); l <= fin; l = ajouterJours(l, 7)) {
        const dim = ajouterJours(l, 6);
        if (dim < debut || dim > fin) continue;
        const minutes = D.pointages.filter(p => p.sid === s.id && p.date >= l && p.date <= dim).reduce((t, p) => t + duree(p.arrivee, p.depart), 0);
        r.semaines.push(Object.assign({ debut: l, fin: dim, numero: numeroSemaine(l), minutes }, heuresSup(minutes)));
      }
    }
    r.hs = r.semaines.reduce((t, w) => ({ h10: t.h10 + w.h10, h20: t.h20 + w.h20, h50: t.h50 + w.h50, total: t.total + w.total }), { h10: 0, h20: 0, h50: 0, total: 0 });
    return r;
  });
}

/* =========================================================
   Espace gérant : affichage
   ========================================================= */
function vueAdmin() {
  const D = S.data;
  const nonLus = D.messages.filter(m => !m.traite).length;
  const onglets = [['aujourdhui', "Aujourd'hui"], ['heures', 'Heures'], ['messages', 'Messages'], ['salaries', 'Salariés'], ['reglages', 'Réglages']];
  const contenu = { aujourdhui: ongletAujourdhui, heures: ongletHeures, messages: ongletMessages, salaries: ongletSalaries, reglages: ongletReglages }[S.onglet]();
  return `
  <div class="admin">
    <header class="barre">
      <div class="logo-p">Il Maestro<small>Espace gérant</small></div>
      <nav class="onglets">
        ${onglets.map(([k, l]) => `<button class="${S.onglet === k ? 'actif' : ''}" data-a="onglet" data-v="${k}">${l}${k === 'messages' && nonLus ? `<span class="pastille">${nonLus}</span>` : ''}</button>`).join('')}
      </nav>
      <div class="droite">
        <button class="btn sec" data-a="actualiser" title="Actualiser">↻</button>
        <button class="btn sec" data-a="quitter">Quitter</button>
      </div>
    </header>
    <div class="contenu">${contenu}</div>
  </div>`;
}

function libelleEtat(l) {
  if (l.enCours) return `<span class="pill encours">En service</span>`;
  if (l.etat === 'travail') return `<span class="pill travail">Service terminé</span>`;
  if (l.etat === 'ferme') return `<span class="pill">Fermé</span>`;
  if (l.etat === 'avenir') return `<span class="pill">Pas encore arrivé</span>`;
  return `<span class="pill ${l.etat}">${ABSENCES[l.etat] || l.etat}</span>`;
}

function ongletAujourdhui() {
  const D = S.data, j = D.now.journee;
  const res = analyser(j, j, 'jour');
  const lignes = res.map(r => ({ r, l: r.lignes[0] }));
  const enService = lignes.filter(x => x.l.enCours).length;
  const termines = lignes.filter(x => x.l.etat === 'travail' && !x.l.enCours).length;
  const absents = lignes.filter(x => x.l.etat === 'absent').length;
  const nonLus = D.messages.filter(m => !m.traite).length;
  const ferme = (D.reglages.joursFermes || []).map(Number).includes(jourSemaine(j));
  return `
  <div class="entete">
    <div><h1 class="titre">${dateLongue(j)}</h1>
    <p class="sous">${ferme ? 'Le restaurant est fermé aujourd’hui.' : `Situation à ${D.now.time}`}</p></div>
  </div>
  <div class="stats">
    <div class="carte stat"><div class="v">${enService}</div><div class="l">En service</div></div>
    <div class="carte stat"><div class="v">${termines}</div><div class="l">Service terminé</div></div>
    <div class="carte stat"><div class="v">${absents}</div><div class="l">Absents</div></div>
    <div class="carte stat" data-a="onglet" data-v="messages" style="cursor:pointer"><div class="v">${nonLus}</div><div class="l">Messages à traiter</div></div>
  </div>
  <div class="grille-sal">
    ${lignes.map(({ r, l }) => {
      const pts = l.pts.map(p => `${p.arrivee} → ${p.depart || '…'}`).join(' · ');
      const cls = l.enCours ? 'encours' : l.etat;
      return `<button class="carte carte-sal ${cls}" data-a="voirJour" data-v="${j}">
        <div class="nom">${esc(r.s.nom)}</div>
        ${libelleEtat(l)}
        <div class="det">${pts ? pts + (l.minutes ? ` · <b>${fmtH(l.minutes)}</b>` : '') : '&nbsp;'}</div>
      </button>`;
    }).join('')}
  </div>`;
}

function puceP(p) {
  const fin = p.depart || 'en cours';
  const d = p.depart ? `<i>${fmtH(duree(p.arrivee, p.depart))}</i>` : '';
  const badge = STATUTS[p.statut] ? `<span class="badge ${p.statut}">${STATUTS[p.statut]}</span>` : '';
  return `<button class="pt ${p.depart ? '' : 'ouvert'} ${p.statut}" data-a="editPt" data-id="${p.id}" title="${esc(p.note || 'Modifier')}">${p.arrivee} → ${fin} ${d}${badge}</button>`;
}
function selectAbs(sid, l) {
  const val = l.typeAbs === 'absent' ? '' : l.typeAbs;
  const premier = l.etat === 'avenir' ? '—' : 'Absent';
  return `<select class="sel-abs ${!val && l.etat === 'absent' ? 'absent' : ''}" data-ch="absence" data-sid="${sid}" data-date="${l.date}">
    <option value="">${premier}</option>
    ${['repos', 'conge', 'maladie', 'justifie'].map(t => `<option value="${t}" ${val === t ? 'selected' : ''}>${ABSENCES[t]}</option>`).join('')}
  </select>`;
}
function celluleSituation(sid, l) {
  if (l.pts.length) return libelleEtat(l);
  if (l.etat === 'ferme') return '<span class="muet">Fermé</span>';
  return selectAbs(sid, l);
}
function resumeAbsences(a) {
  const morceaux = Object.keys(a).filter(k => a[k]).map(k => `${a[k]} ${ABSENCES[k].toLowerCase()}`);
  return morceaux.length ? morceaux.join(', ') : '<span class="muet">—</span>';
}

/* =========================================================
   Export Excel
   ========================================================= */
function construireExport() {
  const P = periode();
  const res = analyser(P.debut, P.fin, S.vue);
  const recap = [['Salarié', 'Jours travaillés', 'Heures (h:mm)', 'Heures (décimal)', 'Contrat (h/sem.)',
    'HS +10 % (36e-39e h)', 'HS +20 % (40e-43e h)', 'HS +50 % (44e h et +)', 'Absences non justifiées',
    'Repos', 'Congés payés', 'Maladie', 'Absences justifiées', 'Pointages à vérifier']];
  const semaines = [['Salarié', 'Semaine', 'Du', 'Au', 'Heures (h:mm)', 'Heures (décimal)', 'HS +10 %', 'HS +20 %', 'HS +50 %']];
  const detail = [['Salarié', 'Date', 'Jour', 'Arrivée', 'Départ', 'Durée (h:mm)', 'Durée (décimal)', 'Statut', 'Note']];
  const frDate = d => d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4);
  res.forEach(r => {
    recap.push([r.s.nom, r.jours, fmtH(r.minutes), dec(r.minutes), r.s.contrat, dec(r.hs.h10), dec(r.hs.h20), dec(r.hs.h50),
      r.absences.absent, r.absences.repos, r.absences.conge, r.absences.maladie, r.absences.justifie, r.aVerifier]);
    r.semaines.forEach(w => semaines.push([r.s.nom, 'S' + w.numero, frDate(w.debut), frDate(w.fin), fmtH(w.minutes), dec(w.minutes), dec(w.h10), dec(w.h20), dec(w.h50)]));
    r.lignes.forEach(l => {
      const jour = JOURS[jourSemaine(l.date)];
      l.pts.forEach(p => {
        const m = duree(p.arrivee, p.depart);
        detail.push([r.s.nom, frDate(l.date), jour, p.arrivee, p.depart || 'en cours', fmtH(m), dec(m), STATUTS[p.statut] || 'Normal', p.note || '']);
      });
      if (!l.pts.length && ABSENCES[l.etat]) detail.push([r.s.nom, frDate(l.date), jour, '', '', '', 0, ABSENCES[l.etat], '']);
    });
  });
  const feuilles = [{ nom: 'Récapitulatif', lignes: recap }];
  if (semaines.length > 1) feuilles.push({ nom: 'Par semaine', lignes: semaines });
  feuilles.push({ nom: 'Détail', lignes: detail });
  return { feuilles, titre: 'Il Maestro – Heures – ' + P.titre, fichier: 'IlMaestro_Heures_' + P.court };
}

function exporterExcel() {
  if (!window.XLSX) return toast("L'export Excel n'a pas pu se charger (connexion internet ?).", true);
  const x = construireExport();
  const wb = XLSX.utils.book_new();
  x.feuilles.forEach(f => {
    const ws = XLSX.utils.aoa_to_sheet(f.lignes);
    ws['!cols'] = f.lignes[0].map((t, i) => ({ wch: Math.max(String(t).length, ...f.lignes.map(l => String(l[i] == null ? '' : l[i]).length)) + 2 }));
    XLSX.utils.book_append_sheet(wb, ws, f.nom);
  });
  XLSX.writeFile(wb, x.fichier + '.xlsx');
  toast('Fichier Excel téléchargé');
}

/* =========================================================
   Actions
   ========================================================= */
async function valider() {
  if (S.code.length < 4) { S.erreur = 'Ton code fait 4 chiffres.'; S.secoue = true; return render(); }
  S.occupe = true; render();
  try {
    S.personne = await api('identifier', { code: S.code });
    S.ecran = 'choix'; S.erreur = '';
    armerRetour(45000);
  } catch (e) {
    S.erreur = e.message; S.code = ''; S.secoue = true;
  }
  S.occupe = false; render();
}

async function pointer(action) {
  if (S.occupe) return;
  S.occupe = true; S.erreur = ''; render();
  try {
    const r = await api('pointer', { code: S.code, action });
    S.confirmation = action === 'arrivee'
      ? { classe: '', titre: `Buon lavoro, ${prenom(r.nom)} !`, texte: `Arrivée enregistrée à <b>${r.heure}</b>` }
      : { classe: 'depart', titre: `Grazie, ${prenom(r.nom)} !`, texte: `Fin de service à <b>${r.heure}</b> · aujourd'hui : <b>${fmtH(r.totalJour)}</b><br>A domani !` };
    S.ecran = 'confirmation'; S.code = '';
    armerRetour(5000);
  } catch (e) {
    S.erreur = e.message;
    armerRetour(45000);
  }
  S.occupe = false; render();
}

async function envoyerMessage() {
  const texte = (document.getElementById('texte-msg') || {}).value || '';
  if (texte.trim().length < 3) { S.erreur = 'Écris ton message avant de l’envoyer.'; render(); return; }
  S.occupe = true; render();
  try {
    const r = await api('signaler', { code: S.code, texte });
    S.confirmation = { classe: 'msg', titre: 'Message envoyé', texte: `Le gérant va corriger ton pointage.<br>Grazie, ${esc(prenom(r.nom))} !` };
    S.ecran = 'confirmation'; S.code = '';
    armerRetour(5000);
  } catch (e) {
    S.erreur = e.message;
    S.occupe = false; render();
    document.getElementById('texte-msg').value = texte;
    return;
  }
  S.occupe = false; render();
}

async function connexion(mdp) {
  S.occupe = true; render();
  try {
    S.data = await api('charger', { mdp });
    S.mdp = mdp; stock.set('im-mdp', mdp);
    S.ecran = 'admin'; S.erreur = ''; S.ref = null;
    armerRetour(10 * 60000);
  } catch (e) {
    stock.set('im-mdp', null);
    S.ecran = 'connexion'; S.erreur = e.message;
  }
  S.occupe = false; render();
  if (S.ecran === 'connexion') { const i = document.getElementById('mdp'); if (i) i.focus(); }
}

/** Appel d'une action du gérant : renvoie les données à jour. */
async function gerant(nom, args, message) {
  S.occupe = true; render();
  try {
    S.data = await api(nom, Object.assign({}, args, { mdp: S.mdp }));
    S.modal = null; S.occupe = false;
    toast(message || 'Enregistré');
    return true;
  } catch (e) {
    S.occupe = false;
    if (S.modal) { S.modal.erreur = e.message; render(); } else toast(e.message, true);
    return false;
  }
}

const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };

const A = {
  rien() { },
  chiffre(v) {
    if (S.occupe || S.code.length >= 4) return;
    S.code += v; S.erreur = ''; render();
    if (S.code.length === 4) valider();
  },
  effacer() { S.code = S.code.slice(0, -1); S.erreur = ''; render(); },
  valider,
  pointer,
  accueil: retourAccueil,
  versMessage() { S.ecran = 'message'; S.erreur = ''; render(); armerRetour(3 * 60000); },
  phrase(v) {
    const t = document.getElementById('texte-msg');
    t.value = PHRASES[+v][1]; t.focus();
    t.setSelectionRange(t.value.length, t.value.length);
  },
  envoyerMessage,
  versGerant() {
    const mdp = stock.get('im-mdp');
    if (mdp) return connexion(mdp);
    S.ecran = 'connexion'; S.erreur = ''; render(); armerRetour(60000);
    const i = document.getElementById('mdp'); if (i) i.focus();
  },
  connexion() { connexion(val('mdp')); },
  quitter: retourAccueil,
  async actualiser() {
    S.occupe = true; render();
    try { S.data = await api('charger', { mdp: S.mdp }); } catch (e) { toast(e.message, true); }
    S.occupe = false; render();
  },
  onglet(v) { S.onglet = v; S.modal = null; render(); window.scrollTo(0, 0); },
  vue(v) { S.vue = v; render(); },
  naviguer(v) { decaler(+v); render(); },
  periodeActuelle() { S.ref = null; render(); },
  deplier(v) { S.deplie[v] = !S.deplie[v]; render(); },
  voirJour(v) { S.onglet = 'heures'; S.vue = 'jour'; S.ref = v; render(); window.scrollTo(0, 0); },
  editPt(_, el) {
    const p = S.data.pointages.find(x => x.id === el.dataset.id);
    if (p) { S.modal = { type: 'pointage', p: Object.assign({}, p) }; render(); }
  },
  nouveauPt(_, el) {
    S.modal = { type: 'pointage', p: { sid: el.dataset.sid, date: el.dataset.date, arrivee: '10:00', depart: '' } };
    render();
  },
  enregistrerPt() {
    const p = S.modal.p;
    gerant('enregistrerPointage', { pointage: { id: p.id, sid: val('m-sid'), date: val('m-date'), arrivee: val('m-arr'), depart: val('m-dep'), note: val('m-note') } });
  },
  supprimerPt() {
    if (confirm('Supprimer ce pointage ?')) gerant('supprimerPointage', { id: S.modal.p.id }, 'Pointage supprimé');
  },
  fermerModal() { S.modal = null; render(); },
  nouveauSal() { S.modal = { type: 'salarie', s: { code: codeLibre(), contrat: 35, actif: true } }; render(); },
  editSal(_, el) { const s = S.data.salaries.find(x => x.id === el.dataset.id); S.modal = { type: 'salarie', s: Object.assign({}, s) }; render(); },
  genererCode() { document.getElementById('m-code').value = codeLibre(); },
  enregistrerSal() {
    const s = S.modal.s;
    gerant('enregistrerSalarie', { salarie: { id: s.id, entree: s.entree, nom: val('m-nom'), code: val('m-code'), contrat: val('m-contrat'), actif: document.getElementById('m-actif').checked } });
  },
  traiter(v, el) { gerant('traiterMessage', { id: el.dataset.id, traite: v === '1' }, v === '1' ? 'Message traité' : 'Message rouvert'); },
  enregistrerReglages() {
    const m1 = val('r-mdp1'), m2 = val('r-mdp2');
    if (m1 !== m2) return toast('Les deux mots de passe ne sont pas identiques.', true);
    const joursFermes = Array.from(document.querySelectorAll('input[name=ferme]:checked')).map(i => +i.value);
    gerant('enregistrerReglages', { reglages: { heureAuto: val('r-auto'), joursFermes, nouveauMdp: m1 || undefined } }, 'Réglages enregistrés')
      .then(ok => { if (ok && m1) { S.mdp = m1; stock.set('im-mdp', m1); } });
  },
  exporter: exporterExcel,
  async exporterSheets() {
    const x = construireExport();
    S.occupe = true; render();
    try {
      const url = await appelServeur('exporterGoogleSheet', S.mdp, x.titre, x.feuilles);
      S.modal = { type: 'lien', url };
    } catch (e) { toast(e.message, true); }
    S.occupe = false; render();
  },
  reinitDemo() { if (confirm('Effacer les données de démo et recommencer ?')) { window.DEMO.reset(); A.actualiser(); } }
};

function codeLibre() {
  const pris = new Set(S.data.salaries.filter(s => s.actif).map(s => s.code));
  let c;
  do { c = String(1000 + Math.floor(Math.random() * 9000)); } while (pris.has(c));
  return c;
}

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'A' || el.dataset.a === 'rien') return;
  e.preventDefault();
  if (S.ecran !== 'pointage' && S.ecran !== 'admin') armerRetour(S.ecran === 'message' ? 3 * 60000 : S.ecran === 'confirmation' ? 0 : 45000);
  if (S.ecran === 'admin') armerRetour(10 * 60000);
  const f = A[el.dataset.a];
  if (f) f(el.dataset.v, el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = A[e.target.dataset.submit];
  if (f) f();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-ch="absence"]');
  if (el) gerant('definirAbsence', { sid: el.dataset.sid, date: el.dataset.date, type: el.value }, 'Enregistré : ' + (el.value ? ABSENCES[el.value] : 'Absent'));
});
document.addEventListener('input', () => {
  if (S.ecran === 'message') armerRetour(3 * 60000);
  if (S.ecran === 'admin') armerRetour(10 * 60000);
});
document.addEventListener('keydown', e => {
  if (S.ecran !== 'pointage' || S.occupe) return;
  if (/^\d$/.test(e.key)) A.chiffre(e.key);
  else if (e.key === 'Backspace') A.effacer();
  else if (e.key === 'Enter') valider();
});

/* Horloge */
setInterval(() => {
  const h = document.getElementById('horloge');
  if (!h) return;
  const n = maintenant();
  if (h.textContent !== n.time) { h.textContent = n.time; document.getElementById('date-jour').textContent = dateLongue(n.date); }
}, 1000);

render();
</script>
</body>
</html>
